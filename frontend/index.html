<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="LearnHub — practical courses, thoughtful lessons, and a clear path to your next skill."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LearnHub — Your next chapter</title>
    <script>
      // Apply the saved preference before painting the page to avoid a theme flash.
      try {
        const saved = localStorage.getItem("learnhub-theme");
        document.documentElement.dataset.bsTheme =
          saved === "dark" ||
          (saved !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
